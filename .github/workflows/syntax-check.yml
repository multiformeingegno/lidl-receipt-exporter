name: Syntax check

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  node-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        run: node --check lidl-receipt-exporter.js
