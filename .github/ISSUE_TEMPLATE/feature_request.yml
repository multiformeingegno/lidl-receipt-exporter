name: Feature request
description: Suggest an improvement or another Lidl country
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: request
    attributes:
      label: Proposal
      description: What would you like the exporter to do?
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: Why would this be useful?

  - type: checkboxes
    id: safety
    attributes:
      label: Scope
      options:
        - label: This request does not require bypassing authentication or accessing another person's data.
          required: true
